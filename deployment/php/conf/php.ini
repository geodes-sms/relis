; Shared effective CLI/Apache settings for PHP 8.4.
; Keep errors visible in logs; index.php controls response display by environment.
expose_php=Off
default_charset=UTF-8
output_buffering=4096
variables_order=GPCS
request_order=GP
register_argc_argv=Off
date.timezone=UTC
memory_limit=128M
max_execution_time=30
max_input_time=60
post_max_size=8M
upload_max_filesize=2M
max_file_uploads=20
file_uploads=On
allow_url_fopen=On
allow_url_include=Off
short_open_tag=On
error_reporting=E_ALL
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/proc/self/fd/2

session.save_handler=files
session.use_strict_mode=1
session.use_cookies=1
session.auto_start=0
session.gc_probability=0
session.gc_maxlifetime=1440
session.serialize_handler=php
; PHP advisory 2026-10-23: apply before request parsing, not with ini_set().
session.upload_progress.enabled=0

; ReLiS appends/generates PHP project configuration while serving requests.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=0
